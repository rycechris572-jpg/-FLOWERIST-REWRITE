name: Build VIRGO (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply VIRGO Phase 3 Brain foundation
        shell: pwsh
        run: ./apply_virgo_phase3_brain.ps1

      - name: Apply VIRGO Phase 3.3 Brain and Autoplay configuration
        shell: pwsh
        run: ./apply_virgo_phase3_3.ps1

      - name: Commit Phase 3 source update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/VirgoShared.hpp src/VirgoBrain.hpp src/FloweristUI.cpp
          git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 1) {
            git commit -m "Start VIRGO Phase 3.3 Brain and Autoplay foundation"
            if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          } elseif ($diffExit -ne 0) {
            throw "git diff check failed with exit code $diffExit"
          } else {
            Write-Host "Phase 3.3 Brain and Autoplay foundation is already applied."
          }

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          build-config: Release

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: virgo-windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
